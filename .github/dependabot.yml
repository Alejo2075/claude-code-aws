version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development
      aws-sdk:
        patterns: ["@aws-sdk/*", "@smithy/*"]
    ignore:
      # Types track the oldest supported runtime (Node 22); raise deliberately with engines.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript < 6.1; upgrade together when it does.
      - dependency-name: typescript
        versions: [">=6.1.0"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
