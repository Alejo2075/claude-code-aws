name: Setup workspace
description: Install pnpm, Node.js, workspace dependencies, and optionally a pinned Claude Code CLI.
inputs:
  node-version:
    description: Node.js version
    default: "24"
  claude-code-version:
    description: Claude Code version to install with npm; empty skips the install
    default: ""
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Install Claude Code ${{ inputs.claude-code-version }}
      if: inputs.claude-code-version != ''
      shell: bash
      env:
        VERSION: ${{ inputs.claude-code-version }}
      run: |
        npm install --global "@anthropic-ai/claude-code@${VERSION}"
        claude --version
