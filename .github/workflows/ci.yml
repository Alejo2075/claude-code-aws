name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly run against the newest Claude Code release to catch platform contract changes early.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tested Claude Code version, and the oldest version plugins in this repository support.
  CLAUDE_CODE_VERSION: 2.1.309
  CLAUDE_CODE_MIN_VERSION: 2.1.295
  DISABLE_AUTOUPDATER: "1"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:versions
      - run: pnpm check:template-markers
      - name: Changeset required for changed released plugins
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm check:changesets "origin/${BASE_REF}"

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
          claude-code-version: ${{ github.event_name == 'schedule' && 'latest' || env.CLAUDE_CODE_VERSION }}
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:mods
      - run: pnpm validate
      - run: pnpm build:release
      - run: pnpm test:packaging
      - run: pnpm test:pipeline
      - run: pnpm test:release-flow

  min-claude-code:
    name: Minimum Claude Code version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: "22"
          claude-code-version: ${{ env.CLAUDE_CODE_MIN_VERSION }}
      - run: pnpm build
      - run: pnpm test:mods
      - run: pnpm validate
      - run: pnpm build:release
      - run: pnpm test:packaging
      - run: pnpm test:pipeline
      - run: pnpm test:release-flow
